<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>단체 채팅방</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f5; --surface: #fff; --ink: #1c1917; --muted: #6b645c; --line: #e7e2db;
    --accent: #d9622b; --accent-ink: #fff; --accent-soft: #fbe9df; --bubble: #fff; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141210; --surface: #1e1b18; --ink: #f2ede6; --muted: #a8a097; --line: #34302b;
      --accent: #ef7a43; --accent-ink: #1c1917; --accent-soft: #3a2519; --bubble: #26221e; --err: #f07167; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", system-ui, sans-serif; line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere; }
  button, input, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* 입장 화면 */
  .gate { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .gate form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px 22px; }
  .gate .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--accent-soft); display: grid; place-items: center; font-size: 1.6rem; margin-bottom: 14px; }
  .gate h1 { font-size: 1.45rem; font-weight: 900; margin: 0 0 4px; letter-spacing: -0.02em; }
  .gate p { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  .gate label { display: block; font-size: .88rem; color: var(--muted); margin: 12px 0 6px; }
  .gate input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 1rem; }
  .gate input:focus, .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .btn { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1rem; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: default; }
  .err { color: var(--err); font-size: .9rem; margin-top: 10px; min-height: 1.3em; }

  /* 채팅 화면 */
  .room { height: 100%; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 900; }
  .online { color: var(--muted); font-size: .85rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .online b { color: var(--accent); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2fb36b; margin-right: 4px; vertical-align: 1px; }
  .dot.off { background: var(--muted); }
  .leave { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: .85rem; cursor: pointer; color: var(--muted); }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .empty { margin: auto; color: var(--muted); font-size: .95rem; text-align: center; }
  .day { align-self: center; font-size: .78rem; color: var(--muted); background: var(--accent-soft); padding: 3px 12px; border-radius: 999px; margin: 6px 0; }
  .sys { align-self: center; font-size: .82rem; color: var(--muted); text-align: center; }
  .sys b { color: var(--ink); font-weight: 700; }
  .msg { display: flex; flex-direction: column; align-items: flex-start; max-width: 82%; }
  .msg .who { font-size: .8rem; color: var(--muted); margin: 0 0 3px 4px; }
  .msg .row { display: flex; align-items: flex-end; gap: 6px; }
  .msg .bubble { background: var(--bubble); border: 1px solid var(--line); padding: 8px 13px; border-radius: 4px 16px 16px 16px; white-space: pre-wrap; }
  .msg time { font-size: .72rem; color: var(--muted); white-space: nowrap; }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.me .row { flex-direction: row-reverse; }
  .msg.me .bubble { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); border-radius: 16px 4px 16px 16px; }
  .msg.cont .who, .msg.me .who { display: none; }
  .composer { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); }
  .composer textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; background: var(--bg); max-height: 120px; font-size: 1rem; line-height: 1.4; }
  .composer button { border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 0 18px; cursor: pointer; }
  .composer button:disabled { opacity: .5; cursor: default; }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: .88rem; padding: 8px 14px; border-radius: 999px; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="joinForm" autocomplete="off">
    <div class="ic">💬</div>
    <h1>단체 채팅방</h1>
    <p>비밀번호를 아는 분만 들어올 수 있어요.</p>
    <label for="nick">닉네임</label>
    <input id="nick" maxlength="12" placeholder="채팅방에서 보일 이름" required>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" inputmode="numeric" placeholder="입장 비밀번호" required>
    <button class="btn" id="joinBtn">입장하기</button>
    <div class="err" id="joinErr" role="alert"></div>
  </form>
</div>

<div class="room hidden" id="room">
  <header>
    <h1>단체 채팅방</h1>
    <div class="online" id="online"><span class="dot off"></span>연결 중…</div>
    <button class="leave" id="leave">나가기</button>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <form class="composer" id="sendForm">
    <textarea id="text" rows="1" maxlength="500" placeholder="메시지를 입력하세요"></textarea>
    <button id="sendBtn">전송</button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let token = store.get("chatToken");
let me = store.get("chatNick") || "";
let es = null;
let lastNick = null, lastDay = null;
$("nick").value = me;

function showGate(msg) {
  if (es) { es.close(); es = null; }
  token = null; store.del("chatToken");
  $("room").classList.add("hidden");
  $("gate").classList.remove("hidden");
  $("joinErr").textContent = msg || "";
  (me ? $("pw") : $("nick")).focus();
}

$("joinForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("joinBtn").disabled = true;
  $("joinErr").textContent = "";
  try {
    const r = await fetch("/api/chat/join", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nick: $("nick").value, password: $("pw").value }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "입장하지 못했어요.");
    token = d.token; me = d.nick;
    store.set("chatToken", token); store.set("chatNick", me);
    $("pw").value = "";
    enter();
  } catch (err) {
    $("joinErr").textContent = err.message;
  } finally {
    $("joinBtn").disabled = false;
  }
});

const pad = (n) => String(n).padStart(2, "0");
const fmtTime = (ts) => { const d = new Date(ts); const h = d.getHours(); return `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}:${pad(d.getMinutes())}`; };
const fmtDay = (ts) => { const d = new Date(ts); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`; };

function addDay(ts) {
  const day = new Date(ts).toDateString();
  if (day === lastDay) return;
  const d = document.createElement("div");
  d.className = "day"; d.textContent = fmtDay(ts);
  $("log").appendChild(d);
  lastDay = day; lastNick = null;
}

function addSystem(m) {
  const log = $("log");
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.querySelector(".empty")?.remove();
  addDay(m.ts);
  const el = document.createElement("div"); el.className = "sys";
  const b = document.createElement("b"); b.textContent = m.nick;
  el.append(b, m.kind === "join" ? "님이 들어왔어요" : "님이 나갔어요", " · " + fmtTime(m.ts));
  log.appendChild(el);
  lastNick = null;
  if (stick) log.scrollTop = log.scrollHeight;
}

function addMessage(m) {
  const log = $("log");
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80 || m.nick === me;
  log.querySelector(".empty")?.remove();
  addDay(m.ts);
  const el = document.createElement("div");
  el.className = "msg" + (m.nick === me ? " me" : "") + (m.nick === lastNick ? " cont" : "");
  const who = document.createElement("div"); who.className = "who"; who.textContent = m.nick;
  const row = document.createElement("div"); row.className = "row";
  const b = document.createElement("div"); b.className = "bubble"; b.textContent = m.text;
  const t = document.createElement("time"); t.textContent = fmtTime(m.ts);
  row.append(b, t); el.append(who, row);
  log.appendChild(el);
  lastNick = m.nick;
  if (stick) log.scrollTop = log.scrollHeight;
}

function setOnline(list, connected) {
  const o = $("online");
  o.replaceChildren();
  const dot = document.createElement("span"); dot.className = "dot" + (connected ? "" : " off");
  o.appendChild(dot);
  if (!connected) { o.append("다시 연결 중…"); return; }
  const b = document.createElement("b"); b.textContent = `${list.length}명`;
  o.append(b, " 접속 중 · " + list.join(", "));
  o.title = list.join(", ");
}

function enter() {
  $("gate").classList.add("hidden");
  $("room").classList.remove("hidden");
  if (es) es.close();
  es = new EventSource("/api/chat/stream?token=" + encodeURIComponent(token));
  es.addEventListener("history", (e) => {
    $("log").replaceChildren(); lastNick = lastDay = null;
    const list = JSON.parse(e.data);
    if (!list.length) {
      const d = document.createElement("div"); d.className = "empty";
      d.textContent = "입장한 뒤의 메시지만 보여요. 첫 인사를 남겨 보세요 👋";
      $("log").appendChild(d);
    }
    list.forEach(addMessage);
    $("log").scrollTop = $("log").scrollHeight;
  });
  es.addEventListener("message", (e) => addMessage(JSON.parse(e.data)));
  es.addEventListener("system", (e) => addSystem(JSON.parse(e.data)));
  es.addEventListener("presence", (e) => setOnline(JSON.parse(e.data).online, true));
  es.onerror = async () => {
    setOnline([], false);
    // 입장권이 만료됐는지 확인하고, 그렇다면 입장 화면으로 돌아가요. (그 외에는 브라우저가 알아서 다시 연결해요)
    if (es.readyState === EventSource.CLOSED) {
      const r = await fetch("/api/chat/me", { headers: { "x-chat-token": token } }).catch(() => null);
      if (r && r.status === 401) showGate("입장 시간이 지났어요. 다시 입장해 주세요.");
      else setTimeout(() => token && enter(), 3000);
    }
  };
  $("text").focus();
}

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

async function send() {
  const text = $("text").value.trim();
  if (!text) return;
  $("sendBtn").disabled = true;
  try {
    const r = await fetch("/api/chat/send", {
      method: "POST", headers: { "Content-Type": "application/json", "x-chat-token": token },
      body: JSON.stringify({ text }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) return showGate(d.error);
    if (!r.ok) return toast(d.error || "보내지 못했어요.");
    $("text").value = ""; autosize();
  } catch {
    toast("인터넷 연결을 확인해 주세요.");
  } finally {
    $("sendBtn").disabled = false;
    $("text").focus();
  }
}
$("sendForm").addEventListener("submit", (e) => { e.preventDefault(); send(); });
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
function autosize() { const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; }
$("text").addEventListener("input", autosize);
$("leave").addEventListener("click", () => showGate(""));

if (token) enter(); else showGate("");
</script>
</body>
</html>
